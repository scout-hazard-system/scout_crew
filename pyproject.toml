[project]
name = "scout_crew"
version = "0.1.0"
description = "scout_crew using crewAI"
authors = [{ name = "Scout Project Contributors" }]
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "crewai[tools]>=1.15.17,<2.0.0",
    "pyside6>=6.6",
]

[project.scripts]
scout_crew = "scout_crew.main:run"
run_crew = "scout_crew.main:run"
train = "scout_crew.main:train"
replay = "scout_crew.main:replay"
test = "scout_crew.main:test"
run_with_trigger = "scout_crew.main:run_with_trigger"
scout = "scout_crew.cli:main"
scout_cli = "scout_crew.cli:main"
scout_gui = "scout_crew.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "36332b3f-76f1-4538-9035-832bad9ca86e"
